# Weekly dependency update PRs. Minor/patch updates are grouped per ecosystem to limit noise.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Backend Dockerfile (python base image, uv image).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The project requires Python 3.14.x (requires-python = ">=3.14,<3.15"); bump the minor
      # version deliberately, together with pyproject.toml.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  # Frontend Dockerfile (node build stage, nginx-unprivileged runtime).
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly

  # docker-compose.yml (postgres image).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
