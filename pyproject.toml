[project]
name = "nuvexa-autotask-ai-agent"
version = "0.1.0"
description = "NUVEXA-AutoTask-AI-Agent — agentic email-to-work automation with human approval (Elarxsys)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Elarxsys" }]
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic[email]>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "alembic>=1.20.1",
    "psycopg[binary,pool]>=3.3.6",
    "aiosqlite>=0.22.1",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "openai>=3.37.0",
    "msal>=1.39.0",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
    "structlog>=26.1.0",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "azure-identity>=1.25",
]

[project.scripts]
nuvexa = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
    "hypothesis>=6.170.9",
    "pyyaml>=6.0.3",  # workflow/compose/Dependabot configuration tests (tests/security)
]

# Security scanners run by CI and scripts/security-scan.sh (`uv run --only-group security …`); locked with
# hashes like every other dependency, not installed by default.
security = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

# System end-to-end tests against the Docker Compose stack (`scripts/e2e.sh`); not installed by default.
e2e = [
    "playwright>=1.64.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Release cooldown for uv resolution is not enabled yet: SEC-EX-004 (security-exceptions.toml), expires 2026-11-02.
# nosemgrep: package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown
[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["frontend", "app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF", "PT", "PL", "N", "TID"]
ignore = [
    "PLR0913", # many args are fine for service constructors
    "PLR0917", # FastAPI routes take many query/dependency parameters
    "PLR2004", # magic values in comparisons are fine in tests/rules
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "S101",    # asserts in tests
    "RUF012",
    "B008",    # FastAPI Depends() in defaults
    "N818",    # domain exception names (NotFound, Conflict) read better without "Error"
    "PLC0415", # lazy imports for optional dependencies (telemetry, providers)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802", "ARG"]
"e2e/**" = ["S", "PLR", "ARG"]
"app/db/migrations/**" = ["E501", "N", "I"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^frontend/", "^app/db/migrations/versions/"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["msal.*", "respx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]  # e2e/ runs separately against a live stack
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, isolated tests (tests/unit) — applied automatically by directory",
    "integration: in-process API + worker + database tests (tests/integration) — applied automatically",
    "security: security regression tests (tests/security) — applied automatically",
    "evaluation: offline AI evaluation baseline (tests/evaluation) — applied automatically",
    "postgres: requires a PostgreSQL database (TEST_DATABASE_URL)",
    "live_llm: calls a real LLM provider (opt-in, costs money)",
    "e2e: system tests against a running Docker Compose stack (scripts/e2e.sh)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/db/migrations/*"]

[tool.coverage.report]
# Combined line + branch coverage gate (enforced whenever pytest runs with --cov). Set to the achieved level
# rounded down (2026-10-25: 99.57 %); raise it as coverage improves — never lower it to make CI pass.
fail_under = 99
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload"]

[tool.mutmut]
# Mutation testing for security-critical modules (manual / scheduled; see docs/TESTING_STRATEGY.md).
paths_to_mutate = [
    "app/domain/state_machine.py",
    "app/services/authz.py",
    "app/services/approval_service.py",
    "app/services/execution_service.py",
    "app/services/action_policy.py",
    "app/integrations/microsoft_graph/id_token.py",
]
tests_dir = ["tests/unit/", "tests/security/"]
also_copy = ["app/", "tests/", "scripts/"]
