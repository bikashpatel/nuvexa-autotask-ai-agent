[project]
name = "nuvexa-autotask-ai-agent"
version = "0.1.0"
description = "NUVEXA-AutoTask-AI-Agent — agentic email-to-work automation with human approval (Elarxsys)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Elarxsys" }]
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic[email]>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "alembic>=1.20.1",
    "psycopg[binary,pool]>=3.3.6",
    "aiosqlite>=0.22.1",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "openai>=3.37.0",
    "msal>=1.39.0",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
    "structlog>=26.1.0",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "azure-identity>=1.25",
]

[project.scripts]
nuvexa = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["frontend", "app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF", "PT", "PL", "N", "TID"]
ignore = [
    "PLR0913", # many args are fine for service constructors
    "PLR0917", # FastAPI routes take many query/dependency parameters
    "PLR2004", # magic values in comparisons are fine in tests/rules
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "S101",    # asserts in tests
    "RUF012",
    "B008",    # FastAPI Depends() in defaults
    "N818",    # domain exception names (NotFound, Conflict) read better without "Error"
    "PLC0415", # lazy imports for optional dependencies (telemetry, providers)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802", "ARG"]
"app/db/migrations/**" = ["E501", "N", "I"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^frontend/", "^app/db/migrations/versions/"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["msal.*", "respx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires a PostgreSQL database (TEST_DATABASE_URL)",
    "live_llm: calls a real LLM provider (opt-in, costs money)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]
