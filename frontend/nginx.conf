# NUVEXA AutoTask dashboard — nginx server config (nginxinc/nginx-unprivileged, non-root, port 8080).
#
# This file is an envsubst TEMPLATE. The image copies it to /etc/nginx/templates/default.conf.template
# and the stock entrypoint (20-envsubst-on-templates.sh) renders it to /etc/nginx/conf.d/default.conf at
# container start. Only variables that are defined in the environment AND match NGINX_ENVSUBST_FILTER
# (set to ^API_UPSTREAM$ in the Dockerfile) are substituted, so nginx's own $variables are untouched.
#
#   API_UPSTREAM           scheme://host[:port] of the FastAPI service, no path, no trailing slash.
#                          docker compose: http://api:8000 (default) · Azure Container Apps: http://<api-app-name>
#   NGINX_LOCAL_RESOLVERS  exported by the image's 15-local-resolvers.envsh from /etc/resolv.conf
#                          (enabled with NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1). The upstream is resolved at
#                          request time, so nginx starts even if the API is not up yet and follows the
#                          API's new address when its container is recreated.
#
# This file is included inside the `http {}` block of the image's /etc/nginx/nginx.conf, so `map`
# directives are valid at the top level here.

# --- Cache policy (one place; add_header in a location would drop the inherited security headers) ---
# Keyed on the response status as well as the URI: the header is added with `always`, so error
# responses get a policy too, and an error must never inherit a long-lived one. A 404 for a hashed
# asset (e.g. requested by a new index.html from a replica still serving the old build during a
# rolling deploy) is `no-store`, so no CDN or browser pins the miss for a year. 304 (revalidation:
# its headers update the stored response) and 206 (byte range of the same file) keep the policy.
# `volatile`: re-evaluate on every use. nginx otherwise caches the value per request, and a status
# decided after the first header-filter pass (the range filter's 416 for an unsatisfiable Range)
# would re-use the 200 value and get the immutable policy.
map "$status:$uri" $nuvexa_cache_control {
    volatile;
    default                             "no-cache";
    ~^\d+:/api/                         "";                                     # the API owns its caching
    ~^(200|206|304):/assets/            "public, max-age=31536000, immutable";  # content-hashed by Vite
    ~^\d+:/assets/                      "no-store";                             # missing/failed asset
    ~^(200|206|304):/favicon\.svg$      "public, max-age=86400";
}

# Preserve the scheme / request id set by an outer TLS-terminating proxy (ingress), else use ours.
map $http_x_forwarded_proto $nuvexa_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_request_id $nuvexa_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    resolver          ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    resolver_timeout  5s;

    server_tokens     off;

    # Client address. NGINX_REAL_IP_FROM is the trusted reverse proxy in front of this container (the Container
    # Apps ingress / infrastructure subnet in Azure). X-Forwarded-For is honoured only from it, and the right-most
    # entry that is not trusted becomes $remote_addr. The image default (127.0.0.1/32) trusts no real proxy: the
    # TCP peer is the client and a client-supplied X-Forwarded-For is ignored.
    set_real_ip_from  ${NGINX_REAL_IP_FROM};
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;
    absolute_redirect off;   # never leak the internal :8080 port in redirects
    charset           utf-8;

    # --- Security headers (all responses, including errors) ------------------------------------
    # CSP notes:
    #  * script-src 'self': the Vite build emits no inline scripts; no eval; no third-party scripts.
    #  * style-src 'unsafe-inline' is REQUIRED by Mantine: MantineProvider injects <style> elements at
    #    runtime for theme CSS variables and responsive style props, and components set inline
    #    `style` attributes. Mantine supports nonces (getStyleNonce), but a static nginx deployment
    #    cannot mint a per-request nonce. The residual risk is CSS injection only — scripts stay
    #    locked to 'self', and the app never renders untrusted HTML (email bodies are plain text).
    #  * connect-src 'self': the API is same-origin (/api/v1 proxied below), no CORS.
    #  * Microsoft sign-in/connect are top-level navigations (302s), which CSP does not restrict.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $nuvexa_cache_control always;
    # HSTS belongs on the TLS terminator (ingress / Front Door); this container only speaks HTTP.

    # --- Compression (static assets only; see /api/ below) --------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript application/json
                      application/manifest+json image/svg+xml font/ttf font/otf;

    # --- Liveness probe for the container platform ------------------------------------------------
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Same-origin API reverse proxy ------------------------------------------------------------
    location /api/ {
        # A variable makes nginx resolve the host per request (via `resolver`) instead of once at start.
        # Without a URI part, the original request URI (/api/v1/…) is passed through unchanged.
        set                $nuvexa_api_upstream ${API_UPSTREAM};
        proxy_pass         $nuvexa_api_upstream;
        # `proxy_redirect default` is unavailable with variables: rewrite absolute upstream redirects.
        proxy_redirect     ${API_UPSTREAM}/ /;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        # Host must match the upstream (Azure Container Apps routes internal traffic by Host).
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Forwarded-Proto $nuvexa_forwarded_proto;
        # Overwrite (never append): the API trusts this header for rate limiting and audit IPs, so a
        # client-supplied X-Forwarded-For must not survive. $remote_addr is the real client (realip above).
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Request-ID      $nuvexa_request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Slightly above the API's MAX_REQUEST_BYTES (1 MiB) so the API returns its JSON 413.
        client_max_body_size 2m;

        # Dynamic, user-specific JSON: do not compress (avoids BREACH-style length side channels).
        gzip off;

        # Avoid duplicate headers: nginx adds the security headers above for every response.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Server;
    }

    # --- Static assets (content-hashed, immutable) -----------------------------------------------
    location /assets/ {
        try_files $uri =404;
        access_log off;
        # No byte ranges for hashed assets: a Range request gets the full 200, never a 206 or a 416
        # (a 416 passed the header filter twice and carried two Cache-Control headers).
        max_ranges 0;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
        return 404;
    }

    # --- SPA fallback: client-side routes resolve to index.html (served with no-cache) -------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
